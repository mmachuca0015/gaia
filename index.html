<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- El ?v= no lo lee el servidor: es para el navegador. Chrome guarda el
         favicon por URL de pagina, asi que al cambiar el icono las paginas ya
         visitadas (/explorar, /panel-de-control...) seguian pintando el
         anterior. Cambiar la direccion lo obliga a pedirlo otra vez. Si se
         vuelve a cambiar el icono, hay que subir este numero. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wellco · Reserva tu clase favorita</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
